[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Remote MCP server to manage Garmin Connect cycling workouts, calendar, FTP and training zones"
requires-python = ">=3.12"
dependencies = [
    "garminconnect[workout]==0.3.20",
    "mcp==2.3.0",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-login = "garmin_mcp.login:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
